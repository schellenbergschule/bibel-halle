<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Winterdorf</title>
<style>
:root{--bg:#dfe9f4;--panel:rgba(255,255,255,.85);--ink:#23324a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--panel:rgba(20,30,50,.85);--ink:#e6eefc;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1626;--panel:rgba(20,30,50,.85);--ink:#e6eefc;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);color:var(--ink);padding:8px 12px;border-radius:12px;font-size:14px;max-width:520px;backdrop-filter:blur(6px)}
#hud input[type=range]{flex:1;min-width:120px}
#hint{opacity:.75;font-size:12px;width:100%}

/* ===== Lichterketten-Raetsel: UI, getrennt von der Dorfzeichnung ===== */
#hud{max-width:330px}#hud>span,#hud>input[type=range],#hud>label:first-of-type{display:none!important}
#hint{width:auto;font-size:12px}#gameUI{position:fixed;inset:0;z-index:40;pointer-events:none;color:#24324a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.gPanel{pointer-events:auto;background:rgba(255,255,255,.97);border:1px solid rgba(255,255,255,.8);border-radius:18px;box-shadow:0 20px 70px rgba(8,20,45,.35);box-sizing:border-box}
#modalShade{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(8,20,45,.58);backdrop-filter:blur(5px);pointer-events:auto}#modalShade[hidden]{display:none}
#gameModal{width:min(700px,calc(100vw - 28px));max-height:calc(100vh - 30px);overflow:auto;padding:clamp(20px,4vw,34px)}
#gameModal h1,#gameModal h2{margin:0 0 12px;color:#263853;line-height:1.12}#gameModal h1{font-size:clamp(25px,5vw,39px)}#gameModal h2{font-size:clamp(22px,4vw,30px)}
#gameModal p{font-size:clamp(16px,2.4vw,18px);line-height:1.55;margin:0 0 13px}.eyebrow{font-size:13px!important;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#9a343c}
.gActions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.gBtn{border:0;border-radius:11px;padding:12px 17px;font:700 15px/1 system-ui;cursor:pointer;background:#a6333b;color:white}.gBtn.secondary{background:#e8eef5;color:#263853}.gBtn:hover{filter:brightness(.94)}.gBtn:focus-visible,.answerInput:focus-visible,.choice:focus-visible{outline:3px solid #f4c95d;outline-offset:3px}
.taskBox{margin:16px 0;padding:16px;border-radius:14px;background:#edf4fb}.answerRow{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:14px}.answerInput{width:150px;max-width:55vw;border:2px solid #9db0c8;border-radius:10px;padding:10px 12px;font:700 18px system-ui}.unit{font-weight:800}.choiceList{display:grid;gap:8px;margin-top:14px}.choice{display:flex;gap:10px;align-items:flex-start;padding:11px;border:2px solid #c5d2e1;border-radius:10px;background:white;cursor:pointer}.feedback{margin-top:13px;padding:12px 14px;border-radius:11px;background:#fff3cd;color:#5e4900}.feedback.ok{background:#dff5e7;color:#195c31}.feedback.bad{background:#fde4e4;color:#84252b}
#toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);padding:10px 15px;border-radius:12px;background:rgba(26,39,61,.93);color:#fff;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;max-width:min(520px,85vw)}#toast.show{opacity:1}
#dimmerPanel{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:min(520px,calc(100vw - 30px));padding:16px 20px;pointer-events:auto}#dimmerPanel[hidden]{display:none}#dimmerPanel label{display:block;font-weight:800;margin-bottom:8px}#treeDimmer{width:100%}
#restartMini{position:absolute;right:10px;top:10px;pointer-events:auto;border:0;border-radius:9px;padding:8px 10px;background:rgba(255,255,255,.9);color:#24324a;font-weight:700;cursor:pointer}
@media (prefers-color-scheme:dark){.gPanel{background:rgba(20,30,49,.97);color:#eaf1fb}.gPanel h1,.gPanel h2{color:#fff}.taskBox{background:#273a56}.gBtn.secondary{background:#354a68;color:#fff}.choice{background:#1d2c43;border-color:#536d8f}.answerInput{background:#152238;color:#fff}.feedback{color:#111}}


/* Winterliche Dialoggestaltung */
.gPanel{position:relative;overflow:hidden;background:linear-gradient(155deg,rgba(248,253,255,.98),rgba(223,241,250,.98) 58%,rgba(205,229,243,.98));border:2px solid rgba(255,255,255,.95);box-shadow:0 22px 75px rgba(8,35,68,.42),inset 0 0 0 1px rgba(102,164,197,.28)}
.gPanel::before{content:'❄  ·  ❅  ·  ❄  ·  ❅';display:block;margin:-34px -34px 22px;padding:12px 24px 10px;background:linear-gradient(90deg,#2c6785,#4f91ad,#2c6785);color:rgba(255,255,255,.92);font-size:17px;letter-spacing:.32em;text-align:center;white-space:nowrap}
.gPanel::after{content:'';position:absolute;inset:43px 0 auto;height:9px;background:radial-gradient(circle at 8px -1px,transparent 9px,#f8fdff 10px,#f8fdff 13px,transparent 14px) 0 0/24px 14px repeat-x;pointer-events:none}
#gameModal h1,#gameModal h2{color:#174c69}.eyebrow{color:#347c9b}.taskBox{background:rgba(255,255,255,.68);border:1px solid rgba(73,139,172,.28)}
.gBtn{background:linear-gradient(180deg,#bd4049,#92313a);box-shadow:0 4px 11px rgba(91,31,37,.22)}.gBtn.secondary{background:linear-gradient(180deg,#f8fcff,#d6e8f2);color:#24536c;border:1px solid #a9cadb;box-shadow:none}
#dimmerPanel::before{margin:-16px -20px 16px}.introProgress{display:flex;gap:7px;margin:2px 0 17px}.introDot{width:28px;height:5px;border-radius:4px;background:#b8d5e3}.introDot.on{background:#397f9e}.introLead{font-size:clamp(18px,2.7vw,21px)!important;font-weight:720;color:#184d68}.speechHint{margin-top:15px;padding:12px 14px;border-left:4px solid #3c88a7;background:rgba(255,255,255,.62);border-radius:8px}.speechSample{display:inline-grid;place-items:center;width:30px;height:30px;margin-right:6px;border-radius:50%;background:#fff;border:2px solid #2d6986;color:#22566f;font-weight:900;box-shadow:0 2px 7px rgba(20,65,90,.18)}
@media (prefers-color-scheme:dark){.gPanel{background:linear-gradient(155deg,rgba(24,44,63,.98),rgba(18,34,52,.98));border-color:#86b6cd}.gPanel::after{background:radial-gradient(circle at 8px -1px,transparent 9px,#dff3fa 10px,#dff3fa 13px,transparent 14px) 0 0/24px 14px repeat-x}.gPanel h1,.gPanel h2{color:#dff5ff}.eyebrow{color:#8ed1e9}.introLead{color:#dff5ff}.taskBox,.speechHint{background:rgba(64,101,127,.35)}}


/* Noch winterlicher und weihnachtlicher */
.gPanel{background:linear-gradient(150deg,rgba(252,255,255,.99),rgba(226,244,250,.99) 56%,rgba(210,234,244,.99));border:3px solid rgba(255,255,255,.98);box-shadow:0 24px 80px rgba(0,35,65,.48),inset 0 0 0 2px rgba(76,145,176,.25)}
.gPanel::before{content:'❄  ✦  ❅  ✦  ❄  ✦  ❅';background:linear-gradient(90deg,#174f69 0%,#287895 30%,#9e3038 50%,#287895 70%,#174f69 100%);padding:13px 24px 11px;text-shadow:0 1px 5px rgba(0,0,0,.25)}
.gPanel::after{height:13px;background:radial-gradient(circle at 9px -2px,transparent 10px,#fbfeff 11px,#fbfeff 15px,transparent 16px) 0 0/27px 16px repeat-x}
#gameModal{border-bottom:7px solid #a3343d}#gameModal h1,#gameModal h2{color:#174a63}.eyebrow{color:#a3343d}.introLead{color:#1e607b}
.taskBox{background:linear-gradient(145deg,rgba(255,255,255,.86),rgba(238,249,252,.8));border:1px solid rgba(55,125,155,.34);box-shadow:inset 0 1px 0 white}
.gBtn{background:linear-gradient(180deg,#c3464e,#8d2731);border:1px solid #761f28}.gBtn.secondary{background:linear-gradient(180deg,#fff,#dceff6);border-color:#8fbacd}
.holly{display:flex;align-items:center;gap:8px;margin:0 0 12px;color:#245e42;font-weight:800}.holly::before,.holly::after{content:'✦';color:#b6313b}.treeCallout{padding:14px 16px;border-radius:13px;background:linear-gradient(135deg,rgba(35,104,75,.12),rgba(177,48,57,.10));border:1px solid rgba(50,119,89,.3)}
/* Richtige Sprechblase mit Spitze */
.speechLegend{display:inline-flex;align-items:center;gap:10px}.bubbleDemo{position:relative;display:inline-grid;place-items:center;width:39px;height:31px;border-radius:16px;background:#fff;border:3px solid #2d7697;color:#245f7b;font:900 22px/1 system-ui;box-shadow:0 4px 11px rgba(20,65,90,.25)}.bubbleDemo::after{content:'';position:absolute;left:5px;bottom:-8px;width:11px;height:11px;background:#fff;border-left:3px solid #2d7697;border-bottom:3px solid #2d7697;transform:skew(-22deg) rotate(-18deg)}


/* Farbkorrektur: hoher Kontrast, winterlich und weihnachtlich */
.gPanel{color:#172c3c;background:linear-gradient(155deg,#ffffff 0%,#f1f9fc 58%,#dceef5 100%);border:3px solid #ffffff;box-shadow:0 24px 80px rgba(4,28,50,.48),inset 0 0 0 2px #8bb9cd}
.gPanel::before{background:linear-gradient(90deg,#103f59 0%,#1f6987 35%,#9b2934 50%,#1f6987 65%,#103f59 100%);color:#fff;text-shadow:0 1px 3px #082c41}
#gameModal{border-bottom-color:#9b2934}#gameModal h1,#gameModal h2{color:#123f57;text-shadow:none}.eyebrow{color:#8e2430}.introLead{color:#174c65}.holly{color:#1f5a3b}.holly::before,.holly::after{color:#a12732}
#gameModal p,.taskBox p,.treeCallout,.speechHint{color:#172c3c}.taskBox{background:#fff;border:2px solid #bdd9e5}.treeCallout{background:#edf7f4;border:2px solid #8bbda4}.speechHint{background:#edf7fb;border-left:5px solid #226d8c}
.answerInput{background:#fff;color:#102b3b;border-color:#6f9fb5}.choice{background:#fff;color:#172c3c;border-color:#91b7c8}.feedback{font-weight:650}.feedback.bad{background:#fde8e8;color:#701d25}.feedback.ok{background:#e2f5e8;color:#164b2b}
.gBtn{color:#fff;background:linear-gradient(180deg,#bd3d47,#88242e);border-color:#6f1821}.gBtn.secondary{color:#123f57;background:linear-gradient(180deg,#fff,#dceef5);border-color:#6d9db3}
/* Saubere Sprechblasen-Erklaerung */
.speechLegend{display:grid;grid-template-columns:58px 1fr;align-items:center;gap:14px}.bubbleDemo{position:relative;box-sizing:border-box;width:54px;height:40px;border-radius:20px;background:#fff;border:3px solid #1f6b8b;color:#174e68;font:900 24px/34px system-ui;text-align:center;box-shadow:0 5px 13px rgba(9,53,75,.24)}.bubbleDemo::after{content:'';position:absolute;left:8px;bottom:-9px;width:14px;height:14px;background:#fff;border-left:3px solid #1f6b8b;border-bottom:3px solid #1f6b8b;transform:skew(-22deg) rotate(-17deg);border-bottom-left-radius:3px}.bubbleDemo::before{content:'';position:absolute;left:14px;bottom:-2px;width:17px;height:8px;background:#fff;z-index:1}
@media (max-width:480px){.speechLegend{grid-template-columns:48px 1fr;gap:10px}.bubbleDemo{width:46px;height:36px;font-size:21px;line-height:30px}}
@media (prefers-color-scheme:dark){.gPanel{color:#eef8fc;background:linear-gradient(155deg,#17384a,#102a3a 65%,#0d2432);border-color:#d8f1fa;box-shadow:0 24px 80px rgba(0,0,0,.62),inset 0 0 0 2px #4e8299}.gPanel h1,.gPanel h2,#gameModal h1,#gameModal h2{color:#f3fbff}.eyebrow{color:#ff9da5}.introLead{color:#caedf8}.holly{color:#a7dfbd}#gameModal p,.taskBox p,.treeCallout,.speechHint{color:#eef8fc}.taskBox{background:#183c50;border-color:#5f91a7}.treeCallout{background:#193e37;border-color:#5c9e7a}.speechHint{background:#173b4d;border-left-color:#7fc9e5}.answerInput,.choice{background:#0d2838;color:#f4fbff;border-color:#76a9bf}.gBtn.secondary{color:#eef8fc;background:#244c61;border-color:#74a9bf}.bubbleDemo,.bubbleDemo::after,.bubbleDemo::before{background:#f8fdff}.bubbleDemo{color:#174e68}}


/* Einheitliche Sprechblase in Anleitung und Dorf */
.bubbleDemo{width:62px;height:53px;border:0!important;background:transparent!important;box-shadow:none!important;overflow:visible;display:block}.bubbleDemo::before,.bubbleDemo::after{display:none!important}.bubbleDemo path{fill:#fbfeff;stroke:#1f6b8b;stroke-width:3;stroke-linejoin:round}.bubbleDemo text{fill:#174e68;font:900 25px system-ui}.speechLegend{grid-template-columns:66px 1fr}.celebrateNote{color:#174c65;font-weight:800}
@media (prefers-color-scheme:dark){.bubbleDemo path{fill:#f8fdff}.bubbleDemo text{fill:#174e68}.celebrateNote{color:#caedf8}}


/* V8: Beschriftete Interaktionen und dauerhaftes Dimmer-Feld */
#dimmerPanel{bottom:18px;width:min(620px,calc(100vw - 28px));padding:16px 20px 18px}
#dimmerMessage{margin:0 0 11px;font-size:16px;line-height:1.42;color:#123f57}
#dimmerMessage strong{color:#8e2430}#dimmerPanel.done #dimmerMessage{color:#164b2b;font-weight:750}
#dimmerPanel.done input,#dimmerPanel.done label{display:none}
@media (prefers-color-scheme:dark){#dimmerMessage{color:#eef8fc}#dimmerMessage strong{color:#ffadb4}#dimmerPanel.done #dimmerMessage{color:#bceacb}}


/* V9: Fortschrittsliste und sauber gerenderte Interaktionslabels */
#causePanel{position:absolute;left:12px;top:118px;width:min(270px,calc(100vw - 24px));padding:14px 15px 15px;pointer-events:none;color:#173044;background:rgba(248,253,255,.96);border:2px solid #8bb9cd;border-radius:16px;box-shadow:0 12px 35px rgba(8,38,61,.28)}
#causePanel[hidden]{display:none}#causePanel h3{margin:0 0 5px;color:#123f57;font-size:16px}#causePanel .causeLead{margin:0 0 10px;font-size:12px;line-height:1.35;color:#446273}
#causeList{display:grid;gap:6px;margin:0;padding:0;list-style:none}.causeItem{display:grid;grid-template-columns:20px 1fr;gap:7px;align-items:start;font-size:13px;line-height:1.25}.causeBox{display:grid;place-items:center;width:17px;height:17px;border:2px solid #628da3;border-radius:5px;background:#fff;color:#fff;font-size:12px;font-weight:900}.causeItem.checked{color:#55717f;text-decoration:line-through;text-decoration-thickness:1px}.causeItem.checked .causeBox{background:#2f7a58;border-color:#2f7a58;color:#fff}.causeItem.checked .causeBox::after{content:'✓'}
@media (max-width:760px){#causePanel{top:auto;bottom:10px;left:10px;width:min(250px,calc(100vw - 20px));padding:10px 12px}#causePanel h3{font-size:14px}.causeItem{font-size:11px;gap:5px}.causeBox{width:14px;height:14px}}
@media (prefers-color-scheme:dark){#causePanel{color:#edf8fc;background:rgba(15,39,54,.96);border-color:#6fa7be}#causePanel h3{color:#f4fbff}#causePanel .causeLead{color:#b9d6e3}.causeItem.checked{color:#92afba}.causeBox{background:#102b3b}}


/* V10: kompakte Bedienung und Ursacheleiste am unteren Rand */
#hud{top:calc(env(safe-area-inset-top,0px) + 6px);left:6px;right:auto;gap:7px;max-width:250px;padding:5px 8px;border-radius:9px;font-size:11px;line-height:1.15;box-shadow:0 4px 14px rgba(8,30,50,.2)}
#hud #hint{font-size:10px;max-width:150px;line-height:1.15}#hud label{gap:4px;white-space:nowrap}#hud input[type=checkbox]{width:13px;height:13px;margin:0}
#causePanel{position:absolute;left:50%;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);transform:translateX(-50%);width:min(980px,calc(100vw - 120px));padding:8px 12px 9px;border-radius:14px;background:rgba(248,253,255,.92);backdrop-filter:blur(7px);box-shadow:0 8px 26px rgba(8,38,61,.25)}
#causePanel h3{display:inline;margin:0 8px 0 0;font-size:13px}#causePanel .causeLead{display:inline;margin:0;font-size:10px}
#causeList{grid-template-columns:repeat(4,minmax(150px,1fr));gap:5px 13px;margin-top:7px}.causeItem{grid-template-columns:16px 1fr;gap:5px;font-size:10.5px;line-height:1.16}.causeBox{width:13px;height:13px;border-width:1.5px;border-radius:4px;font-size:9px}
@media (max-width:900px){#causePanel{width:min(680px,calc(100vw - 90px))}#causeList{grid-template-columns:repeat(2,minmax(180px,1fr))}}
@media (max-width:560px){#hud{max-width:220px}#hud #hint{max-width:125px;font-size:9px}#causePanel{left:8px;right:8px;width:auto;transform:none;bottom:6px;padding:7px 9px}#causePanel h3{font-size:12px}#causePanel .causeLead{display:none}#causeList{grid-template-columns:repeat(2,minmax(120px,1fr));gap:4px 8px}.causeItem{font-size:9px}.causeBox{width:12px;height:12px}}


/* V11: Ursacheleiste als echter Menuebereich ausserhalb der Spielwelt */
:root{--cause-menu-h:92px}body{overflow:hidden;background:#dcebf7}canvas{position:fixed;left:0;top:0;width:100%;height:calc(100% - var(--cause-menu-h))!important}
#causePanel{z-index:55;box-sizing:border-box;position:fixed;left:0;right:0;bottom:0;transform:none;width:100%;height:var(--cause-menu-h);padding:9px 18px 10px;border:0;border-top:3px solid #337a99;border-radius:0;background:#f7fcff;backdrop-filter:none;box-shadow:0 -6px 20px rgba(8,38,61,.24);color:#16384b}
#causePanel h3{display:inline;margin:0 10px 0 0;color:#123f57;font-size:14px;font-weight:850}#causePanel .causeLead{display:inline;color:#35596c;font-size:11px;font-weight:650}
#causeList{grid-template-columns:repeat(4,minmax(150px,1fr));gap:7px 20px;margin-top:8px}.causeItem{grid-template-columns:17px 1fr;gap:6px;color:#17384b;font-size:11px;font-weight:700;line-height:1.16}.causeBox{width:14px;height:14px;border:2px solid #356f89;background:#fff}.causeItem.checked{color:#607985;text-decoration-color:#607985}.causeItem.checked .causeBox{background:#2f7a58;border-color:#2f7a58}
@media (prefers-color-scheme:dark){body{background:#0d2432}#causePanel{background:#102c3c;border-top-color:#78afc5;color:#f0f9fc}#causePanel h3{color:#fff}#causePanel .causeLead{color:#c5dce7}.causeItem{color:#f0f9fc}.causeItem.checked{color:#9db6c1;text-decoration-color:#9db6c1}.causeBox{background:#fff;border-color:#80b3c9}}
@media (max-width:900px){:root{--cause-menu-h:126px}#causePanel{padding:8px 13px}#causeList{grid-template-columns:repeat(2,minmax(180px,1fr));gap:6px 16px}}
@media (max-width:560px){:root{--cause-menu-h:136px}#causePanel{left:0;right:0;bottom:0;width:100%;height:var(--cause-menu-h);padding:7px 9px}#causePanel h3{font-size:12px}#causePanel .causeLead{display:inline;font-size:9px}#causeList{grid-template-columns:repeat(2,minmax(125px,1fr));gap:5px 8px}.causeItem{font-size:9.5px}.causeBox{width:12px;height:12px}}
/* Vor Auftrag nutzt die Spielwelt die volle Hoehe. */
body.causes-hidden canvas{height:100%!important}


/* V13: Dimmer als obere Aktionsleiste, nie hinter dem Ursachenmenue */
#dimmerPanel{z-index:58;position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);bottom:auto;transform:translateX(-50%);box-sizing:border-box;width:min(680px,calc(100vw - 290px));max-height:calc(100vh - var(--cause-menu-h) - 20px);padding:12px 18px 14px;border-radius:16px;box-shadow:0 12px 35px rgba(5,30,50,.38)}
#dimmerPanel::before{margin:-12px -18px 12px;padding:8px 18px 7px;font-size:13px}
#dimmerMessage{margin:0 0 8px;font-size:14px;line-height:1.35}#dimmerPanel label{font-size:13px;margin-bottom:5px}#treeDimmer{display:block;width:100%;margin:0}
#dimmerPanel.done{width:min(650px,calc(100vw - 290px));padding-bottom:13px}
@media (max-width:760px){#dimmerPanel,#dimmerPanel.done{top:calc(env(safe-area-inset-top,0px) + 70px);width:calc(100vw - 24px);max-height:calc(100vh - var(--cause-menu-h) - 82px)}#dimmerMessage{font-size:13px}}


/* V14: Dimmerkopf ohne Ueberlagerung von Zierkante und Text */
#dimmerPanel{overflow:visible;padding:50px 20px 16px;background:linear-gradient(155deg,#ffffff 0%,#edf8fc 62%,#dceef5 100%);border:3px solid #ffffff;box-shadow:0 12px 35px rgba(5,30,50,.38),inset 0 0 0 2px #8bb9cd}
#dimmerPanel::before{content:'❄  ✦  ❅  ✦  ❄  ✦  ❅';position:absolute;box-sizing:border-box;left:-3px;right:-3px;top:-3px;height:37px;margin:0;padding:8px 18px 7px;border-radius:16px 16px 0 0;background:linear-gradient(90deg,#103f59 0%,#1f6987 35%,#9b2934 50%,#1f6987 65%,#103f59 100%);color:#fff;font-size:13px;letter-spacing:.28em;line-height:19px;text-align:center;text-shadow:0 1px 3px #082c41;white-space:nowrap;overflow:hidden}
#dimmerPanel::after{content:'';position:absolute;left:0;right:0;top:30px;height:14px;background:radial-gradient(circle at 9px -2px,transparent 10px,#ffffff 11px,#ffffff 15px,transparent 16px) 0 0/27px 16px repeat-x;pointer-events:none}
#dimmerMessage{position:relative;z-index:2;margin:0 0 10px;color:#123f57;font-size:14px;line-height:1.42}#dimmerMessage strong{color:#8e2430}#dimmerPanel label{position:relative;z-index:2;color:#17384b;font-size:13px;margin-bottom:6px}#treeDimmer{position:relative;z-index:2}
#dimmerPanel.done{padding-top:50px;padding-bottom:15px}#dimmerPanel.done #dimmerMessage{color:#164b2b}

const flakes=[];
function snowStep(dt){
  const sI=snowI(),target=Math.floor(25+sI*735);
  while(flakes.length<target)flakes.push({x:Math.random()*cv.width,y:Math.random()*cv.height,z:Math.random(),ph:Math.random()*6});
  flakes.length=Math.min(flakes.length,target);
  const wind=15+sI*90;
  for(const f of flakes){
    f.y+=(30+f.z*60+sI*90)*dt*dpr;f.x+=(Math.sin(f.ph+performance.now()/900)*18+wind*(.4+f.z))*dt*dpr;
    if(f.y>cv.height){f.y=-5;f.x=Math.random()*cv.width}if(f.x>cv.width)f.x=0;
  }
}
function drawSnow(){
  ctx.setTransform(1,0,0,1,0,0);
  for(const f of flakes){ctx.globalAlpha=.55+f.z*.4;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(f.x,f.y,(1+f.z*2)*dpr,0,7);ctx.fill()}
  ctx.globalAlpha=1;
}

const SAVE_KEY='winterdorf-lichterkette-v2';
const freshState=()=>({version:2,progress:0,completedMain:[],completedSide:[],guideBriefed:false,allCausesNotice:false,childInterviewed:false,grandpaIdentified:false,grandpaSolved:false,dimmerUnlocked:false,dimmerValue:0,gameCompleted:false,used:{},player:{x:330,y:512}});
let gameState=freshState(),activeCharacter=null,activeTask=null,attempts=0;
window.gameModalOpen=false;window.__treeDimmer=0;
const $=s=>document.querySelector(s),shade=$('#modalShade'),modal=$('#gameModal'),dimmerPanel=$('#dimmerPanel'),treeDimmer=$('#treeDimmer');
const CAUSE_ORDER=[
 ['hut','Kabel oder Stecker nicht richtig verbunden'],['wood','Generator ohne Benzin'],['group','Lichterkette selbst defekt'],['ice','Einzelne Glühbirnen defekt'],
 ['bench','Zeitschaltuhr falsch eingestellt'],['ski','Sicherung herausgesprungen'],['dog','Steckdose ohne Strom'],['shovel','Feuchtigkeit in einem Anschluss']
];
let causeLayoutState=null,causeListSignature='';
function renderCausePanel(){
 const panel=$('#causePanel');if(!panel)return;
 const visible=!!gameState.guideBriefed;
 panel.hidden=!visible;
 document.body.classList.toggle('causes-hidden',!visible);
 const signature=CAUSE_ORDER.map(([id])=>gameState.completedMain.includes(id)?'1':'0').join('');
 if(signature!==causeListSignature){
  causeListSignature=signature;
  $('#causeList').innerHTML=CAUSE_ORDER.map(([id,text])=>`<li class="causeItem${gameState.completedMain.includes(id)?' checked':''}"><span class="causeBox" aria-hidden="true"></span><span>${text}</span></li>`).join('')
 }
 if(causeLayoutState!==visible){
  causeLayoutState=visible;
  requestAnimationFrame(()=>{if(typeof resize==='function')resize()})
 }
}
function saveGame(){gameState.player={x:P.x,y:P.y};localStorage.setItem(SAVE_KEY,JSON.stringify(gameState));renderCausePanel()}
function loadGame(){try{const x=JSON.parse(localStorage.getItem(SAVE_KEY));if(x&&x.version===2){gameState=Object.assign(freshState(),x);P.x=x.player?.x??330;P.y=x.player?.y??512;return true}}catch(e){}return false}
function applyProgress(){renderCausePanel();p=clamp(gameState.progress/100,0,1);sl.value=gameState.progress;autoCb.checked=false;window.__treeDimmer=gameState.dimmerValue||0;treeDimmer.value=window.__treeDimmer;$('#dimmerReadout').textContent=window.__treeDimmer+' %';dimmerPanel.hidden=true}
function openModal(body){document.body.classList.add('modal-open');modal.innerHTML=body;shade.hidden=false;window.gameModalOpen=true;stick=null;Object.keys(keys).forEach(k=>keys[k]=false);setTimeout(()=>modal.querySelector('button,input')?.focus(),20)}
function closeModal(){document.body.classList.remove('modal-open');shade.hidden=true;window.gameModalOpen=false;activeTask=null;attempts=0;window.__near=null;Object.keys(keys).forEach(k=>keys[k]=false)}
function btn(label,action,secondary=false){return `<button type="button" class="gBtn${secondary?' secondary':''}" data-act="${action}">${label}</button>`}
function introHtml(){
 return `<p class="eyebrow">Weihnachtsmorgen im Winterdorf</p><div class="holly">❄ Der Morgen beginnt</div><h1 id="modalTitle">Was ist beim Dorfplatz los?</h1><p class="introLead">Viele Menschen stehen beim grossen Weihnachtsbaum. Doch die Lichter bleiben dunkel.</p><div class="treeCallout"><p>Geh zum Baum und frag nach, was geschehen ist. Vielleicht braucht dort jemand deine Hilfe.</p></div><p class="speechHint"><span class="speechLegend"><svg class="bubbleDemo" viewBox="0 0 64 54" aria-hidden="true"><path d="M10 5 H52 Q59 5 59 12 V31 Q59 38 52 38 H27 L13 50 L17 38 H11 Q5 38 5 31 V12 Q5 5 10 5 Z"/><text x="32" y="29" text-anchor="middle">?</text></svg><span><strong>Ein Fragezeichen zeigt:</strong> Hier kannst du jemanden ansprechen. Gehe nahe heran und drücke die Leertaste oder klicke auf die Sprechblase.</span></span></p><div class="gActions">${btn('Zum Dorfplatz','close')}</div>`
}
function startScreen(){const has=!!localStorage.getItem(SAVE_KEY);openModal(has?`<p class="eyebrow">Winterdorf</p><h1 id="modalTitle">Willkommen zurück</h1><p>Ein gespeichertes Spiel wurde gefunden.</p><div class="gActions">${btn('Gespeichertes Spiel fortsetzen','continue')}${btn('Neues Spiel beginnen','new',true)}</div>`:introHtml())}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}
function parseNumber(v){v=String(v).trim().replace(',','.');if(/^[-+]?\d+(\.\d+)?\s*\/\s*[-+]?\d+(\.\d+)?$/.test(v)){const [a,b]=v.split('/').map(Number);return b? a/b:NaN}return /^[-+]?\d+(\.\d+)?$/.test(v)?Number(v):NaN}
  function grnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
  function normalizeText(v){return String(v).trim().toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9]/g,'')}
  function generatedTask(topic){
   const forceChoice=Math.random()<.25;
   if(topic==='random')topic=['proportion','stretch','area','similar','mixed'][grnd(0,4)];
   const pool=GAME_CONTENT.tasks[topic]||GAME_CONTENT.tasks.proportion;
   const progress=clamp((gameState.progress||0)/100,0,1);
   const target=progress<.34?1:progress<.67?2:3;
   let eligible=pool.filter(t=>t.d<=target);
   if(forceChoice){const choices=eligible.filter(t=>t.type==='choice');if(choices.length)eligible=choices}
   const task=eligible[grnd(0,eligible.length-1)];
   return Object.assign({},task,{choices:task.choices?task.choices.slice():undefined,h:task.h.slice(),answers:task.answers?task.answers.slice():undefined})
  }
function pickTask(ch){
 gameState.taskSignatures=gameState.taskSignatures||[];
 let t,sig,tries=0;do{t=generatedTask(ch.topic);sig=t.q;tries++}while(gameState.taskSignatures.includes(sig)&&tries<100);
 gameState.taskSignatures.push(sig);if(gameState.taskSignatures.length>250)gameState.taskSignatures.shift();saveGame();return t
}

/* ---------- MUSIK: Hintergrundlieder im Zufall, Finalsong in Endlosschleife ---------- */
const MU={
  dir:'musik/',
  list:['winterlied-01.mp3','winterlied-02.mp3','winterlied-03.mp3','winterlied-04.mp3'],
  finale:'winterlied-finale.mp3',
  base:.10,      /* Lautstärke der Hintergrundmusik (0 bis 1) */
  finBase:.15,   /* Lautstärke des Finalsongs */
  duckTo:.5,     /* Faktor, auf den die Musik bei offenem Dialog sinkt */
  fade:3,        /* Dauer der Ein- und Ausblendung in Sekunden */
  on:true,started:false,dead:false,mode:'normal',queue:[],last:-1,gap:0,fails:0,ms:1,ds:1,hid:false,t0:performance.now(),
  ch:[0,1].map(()=>({el:new Audio(),node:null,f:0,ft:0,busy:false,fin:false,susp:false,leave:false}))
};
try{if(localStorage.getItem('winterdorf-musik')==='0')MU.on=false}catch(e){}
const musCb=document.getElementById('mus');
if(musCb){musCb.checked=MU.on;musCb.addEventListener('change',()=>{
  MU.on=musCb.checked;try{localStorage.setItem('winterdorf-musik',MU.on?'1':'0')}catch(e){}
  if(MU.on){audioInit();if(AC&&AC.state==='suspended')AC.resume();musicStart()}
})}
MU.ch.forEach(c=>{
  c.el.preload='auto';
  c.el.addEventListener('ended',()=>{c.busy=false;c.ft=0;c.f=0;if(MU.mode==='normal'&&!c.leave)MU.gap=2.5+Math.random()*3});
  c.el.addEventListener('error',()=>{if(!c.busy)return;console.warn('Musikdatei nicht ladbar:',c.el.src);c.busy=false;c.ft=0;c.f=0;MU.fails++;MU.gap=.5;if(MU.fails>MU.list.length+1)MU.dead=true});
  c.el.addEventListener('playing',()=>{MU.fails=0})
});
function musShuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function musNextIdx(){
  if(!MU.queue.length){
    MU.queue=musShuffle(MU.list.map((_,i)=>i));
    const n=MU.queue.length;
    if(n>1&&MU.queue[n-1]===MU.last){const j=(Math.random()*(n-1))|0;[MU.queue[n-1],MU.queue[j]]=[MU.queue[j],MU.queue[n-1]]}
  }
  return MU.queue.pop()
}
function musFree(){return MU.ch.find(c=>!c.busy)||MU.ch.reduce((a,b)=>a.f<b.f?a:b)}
function musWire(c){
  /* Über Web Audio (https) wirkt die Lautstärke auch auf iPhones. Bei file:// bleibt es bei element.volume. */
  if(c.node||!AC||!/^https?:/.test(location.protocol))return;
  try{const s=AC.createMediaElementSource(c.el);c.node=AC.createGain();c.node.gain.value=0;s.connect(c.node);c.node.connect(AC.destination);c.el.volume=1}catch(e){c.node=null}
}
function musApply(c,v){if(c.node)c.node.gain.value=v;else c.el.volume=Math.max(0,Math.min(1,v))}
function musPlay(c,file,fin){
  c.fin=fin;c.busy=true;c.susp=false;c.leave=false;c.f=0;c.ft=1;
  musWire(c);musApply(c,0);
  c.el.src=MU.dir+file;
  const p=c.el.play();
  if(p&&p.catch)p.catch(err=>{if(err&&err.name==='NotAllowedError'){c.busy=false;c.ft=0;MU.started=false}})
}
function musNext(){const i=musNextIdx();MU.last=i;musPlay(musFree(),MU.list[i],false)}
function musStartFinale(){musPlay(musFree(),MU.finale,true)}
function musicStart(){
  if(MU.started||!MU.on||MU.dead||MU.hid)return;
  MU.started=true;
  if(MU.mode==='finale'){if(!MU.ch.some(c=>c.busy&&c.fin&&c.ft>0))musStartFinale()}
  else if(!MU.ch.some(c=>c.busy))musNext()
}
function musicFinale(){
  MU.mode='finale';
  MU.ch.forEach(c=>{if(c.busy&&!c.fin)c.ft=0});
  if(MU.started&&MU.on&&!MU.hid)musStartFinale()
}
function musicTick(){
  const now=performance.now(),dt=Math.min(.25,(now-MU.t0)/1000);MU.t0=now;
  const off=!MU.on||MU.hid;
  MU.ms+=((off?0:1)-MU.ms)*Math.min(1,dt*2.2);
  MU.ds+=((window.gameModalOpen?MU.duckTo:1)-MU.ds)*Math.min(1,dt*3);
  const master=(MU.mode==='finale'?MU.finBase:MU.base)*MU.ms*MU.ds;
  for(const c of MU.ch){
    if(!c.busy)continue;
    const st=dt/MU.fade;c.f=c.ft>c.f?Math.min(c.ft,c.f+st):Math.max(c.ft,c.f-st);
    musApply(c,c.f*master);
    if(off&&MU.ms<.02&&!c.el.paused){c.el.pause();c.susp=true}
    else if(!off&&c.susp){c.susp=false;const p=c.el.play();if(p&&p.catch)p.catch(()=>{})}
    if(c.ft===0&&c.f<=0){c.el.pause();c.busy=false;c.susp=false}
  }
  if(!MU.started||off||MU.dead)return;
  if(MU.mode==='finale'){
    const c=MU.ch.find(x=>x.busy&&x.fin&&x.ft>0);
    if(!c)musStartFinale();
    else{const d=c.el.duration;
      /* sanfte Überblendung zum Neustart, ohne die Stille am Ende des Liedes */
      if(d&&isFinite(d)&&d>8&&c.el.currentTime>d-.8-MU.fade){c.ft=0;musStartFinale()}}
  }else{
    const c=MU.ch.find(x=>x.busy&&x.ft>0);
    if(c){const d=c.el.duration;
      if(!c.leave&&d&&isFinite(d)&&d-c.el.currentTime<=MU.fade+.2){c.leave=true;c.ft=0;MU.gap=2.5+Math.random()*3}}
    else if(!MU.ch.some(x=>x.busy)){MU.gap-=dt;if(MU.gap<=0)musNext()}
  }
}
setInterval(musicTick,50);
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{audioInit();if(AC&&AC.state==='suspended')AC.resume();musicStart()},true));
document.addEventListener('visibilitychange',()=>{

  else if(!MU.started)musicStart()
});

    c.fillStyle=hat;c.beginPath();c.arc(1,-38,8.5,Math.PI,2*Math.PI);c.fill();
    c.fillStyle='#e8eef8';c.beginPath();c.roundRect(-7.5,-39.5,17,4.5,2);c.fill();c.beginPath();c.arc(-3,-47,3.6,0,7);c.fill();
    c.fillStyle='#2a2a33';c.beginPath();c.arc(5,-35.5,1.3,0,7);c.fill();c.fillStyle='#f6d3b0';c.beginPath();c.arc(9,-34,1.8,0,7);c.fill();
    c.strokeStyle=coat;c.lineWidth=4;c.beginPath();c.moveTo(0,-23);c.lineTo(hx2,-14);c.stroke();

    c.translate(0,-bob);
    const a1=ch?Math.sin(m.t*9+m.off)*5:-sw*.5,a2=ch?Math.cos(m.t*9+m.off)*5:sw*.5,ay=ch?-50:-14;
    c.strokeStyle=coat;c.lineWidth=4;c.beginPath();c.moveTo(-7,-24);c.lineTo(-10,ay+a1);c.moveTo(7,-24);c.lineTo(10,ay+a2);c.stroke();

function startFinale(){
  if(FIN.on)return;
  const src=[...skaters,...sledders,...swKids,...wipKids,...fight,...angels,...igK,...watchers,...talk,wk,shv,chp,om,bk];
  if(mug.st!=='in')src.push(mug);if(bh.st!=='in')src.push(bh);
  ['ski','ski2'].forEach(k=>{try{src.push(POINTS[k]())}catch(e){}});
  src.push({x:LX-20,y:LB});
  const st=src.map(o=>o&&{x:o.x??o.px,y:o.y??o.py}).filter(o=>o&&isFinite(o.x)&&isFinite(o.y)).sort((a,b)=>a.x-b.x),n=st.length,cnt=Math.ceil(n/3);
  FIN.m=st.map((s,i)=>{
    const row=i%3,idx=i/3|0,a=lerp(.06,.94,(idx+.5)/cnt)*Math.PI,r=[125,180,235][row],tx=900+Math.cos(a)*r*1.7,ty=585+Math.sin(a)*r*.6;
    const m={x:s.x,y:s.y,st:'wait',d:Math.random()*2.5,ph:Math.random()*6,t:0,off:Math.random()*6,col:FIN_COL[i%FIN_COL.length],lan:i%4===3?0:(i%3===1?2:1),lc:LAN_COL[(i*7)%LAN_COL.length],front:true,wp:finRoute(s.x,s.y).concat([[tx,ty]]),v:78+Math.random()*30};

function finStep(dt){
  if(!FIN.on)return;FIN.t+=dt;let ch=0;
  for(const s of sledders)if(s.fin){const f=s.fin;f.t=Math.min(1,f.t+dt/2);const e=ez(f.t);
    s.sx=s.px=lerp(f.a[0],f.b[0],e);s.sy=s.py=lerp(f.a[1],f.b[1],e);
    let d=f.b[2]-f.a[2];d=Math.atan2(Math.sin(d),Math.cos(d));s.ang=f.a[2]+d*e}
  for(const m of FIN.m){
    m.t+=dt;
    if(m.st==='wait'){m.d-=dt;if(m.d<=0)m.st='walk';else{m.o.y=m.y;continue}}
    if(m.st==='walk'){
      const w=m.wp[0],dx=w[0]-m.x,dy=w[1]-m.y,l=Math.hypot(dx,dy),k=m.v*dt;
      if(l<=k){m.x=w[0];m.y=w[1];m.wp.shift();if(!m.wp.length){m.st='cheer';m.t=0}}
      else{m.x+=dx/l*k;m.y+=dy/l*k;m.ph+=dt*11;
        const ax=Math.abs(dx),ay=Math.abs(dy),cur=m.view||'down';
        if(ax>ay*1.25||(ax>ay*.8&&(cur==='left'||cur==='right')))m.view=dx<0?'left':'right';
        else if(ay>ax*1.25||!m.view||cur==='up'||cur==='down')m.view=dy<0?'back':'front'}
    }
    if(m.st==='cheer'){ch++;m.view='front'}
    m.o.y=m.y
  }
  FIN.cheer=ch;
}
