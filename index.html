const AT_BOOKS=['1. mose','2. mose','3. mose','4. mose','5. mose','josua','richter','rut','1. samuel','2. samuel','1. könige','2. könige','1. chronik','2. chronik','esra','nehemia','ester','hiob','psalmen','sprüche','prediger','hohelied','jesaja','jeremia','klagelieder','hesekiel','daniel','hosea','joel','amos','obadja','jona','micha','nahum','habakuk','zefanja','haggai','sacharja','maleachi'];

function canonicalBookTitle(value){return String(value||'').normalize('NFKC').toLowerCase().replace(/[^a-z0-9äöüß. ]/g,' ').replace(/\s+/g,' ').trim()}
function effectiveTestament(book){if(book?.testament==='AT'||book?.testament==='NT')return book.testament;const title=canonicalBookTitle(book?.title);if(AT_BOOKS.some(x=>title===x||title.startsWith(x+' ')))return'AT';if(NT_BOOKS.some(x=>title===x||title.startsWith(x+' ')))return'NT';return''}
function publishedBooks(){return BOOKS.filter(b=>b.status==='published')}

function awardMedia(item,fallback='🏅',cls='achievement-image'){return item?.imageData?`<img class="${cls}" src="${item.imageData}" alt="${esc(item.title||'Auszeichnung')}">`:`<div class="achievement-icon">${item?.icon||fallback}</div>`}

function badgePuzzleHtml(book,b,size=160){const parts=Math.max(1,+b.parts||1),overall=badgeRank(book,b),whole=rankImage(b,overall);if(parts===1){if(whole)return`<img class="achievement-image" style="width:${size}px;height:${size}px" src="${whole}" alt="${esc(b.title)} ${overall}">`;return awardMedia(b,'🏅')}const available=b.rankImages||b.imageData;if(!available)return awardMedia(b,'🏅');return `<div class="badge-puzzle" style="width:${size}px">${Array.from({length:parts},(_,i)=>{const rank=user.badgeParts?.[badgeKey(book,b,i+1)]?.rank||'none',img=rank==='none'?null:rankImage(b,rank),w=100/parts;return `<span class="badge-puzzle-piece ${rank==='none'?'locked':''}" title="Teil ${i+1}: ${rank==='none'?'offen':rank}" style="left:${i*w}%;width:${w}%;${img?`background-image:url('${img}');`:''}background-size:${parts*100}% 100%;background-position:${parts===1?0:(i/(parts-1))*100}% 0"></span>`}).join('')}</div>`}
async function prepareAwardImage(file){if(!file)return null;if(!['image/png','image/webp','image/jpeg'].includes(file.type))throw new Error('Erlaubt sind PNG, WebP und JPEG.');if(file.size>1200000)throw new Error('Die Datei darf höchstens 1,2 MB groß sein.');const url=URL.createObjectURL(file),img=new Image();await new Promise((ok,fail)=>{img.onload=ok;img.onerror=fail;img.src=url});if(img.naturalWidth!==img.naturalHeight)throw new Error('Das Bild muss quadratisch sein. Empfohlen: 512 × 512 Pixel.');if(img.naturalWidth<256||img.naturalWidth>1024)throw new Error('Die Bildkante muss zwischen 256 und 1024 Pixel liegen. Empfohlen: 512 Pixel.');const c=document.createElement('canvas');c.width=c.height=512;const ctx=c.getContext('2d');ctx.clearRect(0,0,512,512);ctx.drawImage(img,0,0,512,512);URL.revokeObjectURL(url);return c.toDataURL('image/webp',.86)}
async function prepareFlexibleShopImage(file){if(!file)return null;if(!['image/png','image/webp','image/jpeg'].includes(file.type))throw new Error('Erlaubt sind PNG, WebP und JPEG.');if(file.size>1200000)throw new Error('Die Datei darf höchstens 1200 KB gross sein.');const url=URL.createObjectURL(file),img=new Image();await new Promise((ok,fail)=>{img.onload=ok;img.onerror=fail;img.src=url});const max=1400,k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*k));c.height=Math.max(1,Math.round(img.naturalHeight*k));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);return c.toDataURL('image/webp',.86)}
async function prepareGameImage(file){if(!file)return null;if(!['image/png','image/webp','image/jpeg'].includes(file.type))throw new Error('Nur PNG, WebP oder JPEG.');if(file.size>1800000)throw new Error('Bild maximal 1,8 MB.');const u=URL.createObjectURL(file),im=new Image();await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=u});const max=900,k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);return c.toDataURL('image/webp',.82)}
function seededShuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return String(s||'').trim().toUpperCase().replace(/Ä/g,'AE').replace(/Ö/g,'OE').replace(/Ü/g,'UE').replace(/[^A-Z0-9]/g,'')}
function badgeKey(book,badge,part){return`${book.id}:${badge.id}:${part}`}
function badgeRank(book,b){const parts=Array.from({length:+b.parts||1},(_,i)=>user.badgeParts?.[badgeKey(book,b,i+1)]?.rank||'none');if(parts.some(x=>x==='none'))return'none';const m=Math.floor(parts.length/2)+1;if(parts.filter(x=>x==='gold').length>=m)return'gold';if(parts.filter(x=>RV[x]>=2).length>=m)return'silver';return'bronze'}
function bookTrophyRank(book){const ids=book.trophyBadgeIds||[];if(!ids.length)return'none';const ranks=ids.map(id=>{const b=(book.badges||[]).find(x=>x.id===id);return b?badgeRank(book,b):'none'});if(ranks.some(r=>r==='none'))return'none';const m=Math.floor(ranks.length/2)+1;if(ranks.filter(r=>r==='gold').length>=m)return'gold';if(ranks.filter(r=>RV[r]>=2).length>=m)return'silver';return'bronze'}
function rankPill(r){return`<span class="rank ${r}">${r==='none'?'Noch offen':r[0].toUpperCase()+r.slice(1)}</span>`}
function requiredSectionId(value){return String(typeof value==='string'?value:(value?.id||value?.sectionId||value?.value||'')).trim()}
function readingValueDone(value){return value===true||value===1||value==='true'||value?.done===true||value?.read===true||value?.completed===true}
function isSectionRead(book,required){const wanted=requiredSectionId(required);if(!wanted)return false;const sections=book.sections||[];const sec=sections.find(x=>[x.id,x.reference,x.title].some(v=>String(v||'').trim()===wanted));const candidates=[wanted,sec?.id,sec?.reference,sec?.title].filter(Boolean).map(String);return candidates.some(id=>readingValueDone(user.reading?.[`${book.id}:${id}`]))}
function isGameUnlocked(book,g){const required=(g.requiredSectionIds||[]).map(requiredSectionId).filter(Boolean);return required.length===0||required.every(id=>isSectionRead(book,id))}
async function synchronizeUnlocks(){if(!user||!BOOKS.length)return;const next={...(user.unlocks||{})};let changed=false;BOOKS.forEach(book=>(book.games||[]).forEach(g=>{const key=`${book.id}:${g.id}`,available=isGameUnlocked(book,g);if(available&&next[key]!==true){next[key]=true;changed=true}}));if(changed){user.unlocks=next;await updateDoc(doc(db,'users',user.uid),{unlocks:next,updatedAt:serverTimestamp()})}}

function normalizeQuestions(g){if(g?.config?.questions?.length)return structuredClone(g.config.questions);if(g?.type==='quiz'&&g.config?.question)return[{id:crypto.randomUUID(),text:g.config.question,answers:(g.config.answers||[]).map((text,i)=>({id:crypto.randomUUID(),text,correct:i===g.config.correct}))}];return[]}

function configFields(type){const c=window._editingConfig||{};if(type==='quiz')return quizBuilderHtml();if(type==='hangman')return`<div class="field"><label>Gesuchtes Wort</label><input id="g-word" value="${esc(c.word||'')}" required></div><div class="field"><label>Beschreibung</label><input id="g-clue" value="${esc(c.clue||'')}"></div>`;if(type==='secret')return`<div class="field"><label>Geheimschrift</label><input id="g-encoded" value="${esc(c.encoded||'')}"></div><div class="field"><label>Optionales Bild</label><input id="g-secret-image" type="file" accept="image/*">${c.image?`<img class="asset-preview" src="${c.image}">`:''}<label><input id="g-secret-image-remove" type="checkbox" style="width:auto"> Bild entfernen</label></div><div class="field"><label>Lösung</label><input id="g-answer" value="${esc(c.answer||'')}" required></div>`;if(type==='cipher')return`<div class="field"><label>Lösungstext</label><textarea id="g-text" required>${esc(c.text||'')}</textarea></div><div class="field"><label>Verschlüsselung</label><select id="g-cipher"><option value="caesar" ${c.method==='caesar'?'selected':''}>Cäsarcode</option><option value="keyboard" ${c.method==='keyboard'?'selected':''}>Tastatur: eins nach rechts</option><option value="morse" ${c.method==='morse'?'selected':''}>Morsecode</option><option value="reverse" ${c.method==='reverse'?'selected':''}>Rückwärts und Leerzeichen neu verteilen</option><option value="xinsert" ${c.method==='xinsert'?'selected':''}>X zwischen zwei Buchstaben</option><option value="numbers" ${c.method==='numbers'?'selected':''}>Buchstaben als Zahlen</option></select></div><div class="field"><label>Verschiebungszahl für Cäsarcode</label><input id="g-shift" type="number" min="1" max="25" value="${c.shift||3}"></div>`;if(type==='whoami')return`<div class="field"><label>Lösung</label><input id="g-answer" value="${esc(c.answer||'')}" required></div><div class="field"><label>Tipps, einer pro Zeile</label><textarea id="g-lines" class="admin-lines" required>${esc((c.hints||[]).join('\n'))}</textarea></div>`;if(type==='timeline'||type==='sequence')return`<div class="field"><label>${type==='timeline'?'Ereignisse in chronologischer Reihenfolge':'Schritte in richtiger Reihenfolge'}</label><textarea id="g-lines" class="admin-lines" required>${esc((c.items||[]).join('\n'))}</textarea><div class="muted">Eine Zeile pro Karte. Die eingegebene Reihenfolge ist die richtige Lösung.</div></div>`;if(type==='versepairs')return`<div class="field"><label>Vers-Paare</label><textarea id="g-lines" class="admin-lines" required>${esc((c.pairs||[]).map(x=>x.a+' | '+x.b).join('\n'))}</textarea><div class="muted">Je Zeile: Versanfang | passendes Versende</div></div>`;if(type==='woordle')return`<div class="alert ok">Der Spieler hat unbegrenzt viele Versuche. Gold, Silber und Bronze werden über die Anzahl Versuche gesteuert.</div><div class="field"><label>Lösungswort</label><input id="g-word" value="${esc(c.word||'')}" maxlength="12" style="text-transform:uppercase" required><div class="muted">2 bis 12 Buchstaben, ohne Leerzeichen.</div></div>`;const info={memory:'Je Zeile ein Paar: Text A | Text B. Für Bilder: IMAGE | IMAGE und danach Dateien wählen.',wordsearch:'Ein Suchwort pro Zeile.',matching:'Je Zeile ein Paar: links | rechts.',puzzle:'Bild und Anzahl Spalten/Zeilen.',order:'Text und Anzahl Wörter pro Teil.',crossword:'Je Zeile: WORT | Hinweis | Startspalte. Lösungs-Spalte und Lösungswort separat.',flashlight:'Je Zeile: verstecktes Objekt | Buchstabe. Danach Lösungswort.',differences:'Original- und Fehlerbild; sieben Trefferpositionen als x,y in Prozent.',maze:'Ausgänge je Zeile: Beschriftung | richtig (ja/nein).',cloze:'Text mit [Lücke]; je Zeile Lösungen, optional Alternativen mit |.'}[type]||'';let f=`<div class="alert ok">${info}</div>`;if(['memory','matching'].includes(type))f+=`<div class="field"><label>Paare</label><textarea id="g-lines" class="admin-lines">${esc((c.pairs||[]).map(p=>p.a+' | '+p.b).join('\n'))}</textarea></div><div class="field"><label>Bilder für Karten (optional, Reihenfolge A1,B1,A2,B2...)</label><input id="g-images" type="file" multiple accept="image/*"></div>`;if(type==='wordsearch')f+=`<div class="field"><label>Suchwörter</label><textarea id="g-lines" class="admin-lines">${esc((c.words||[]).join('\n'))}</textarea></div>`;if(type==='puzzle')f+=`<div class="field"><label>Puzzlebild</label><input id="g-image" type="file" accept="image/*" ${c.image?'':'required'}>${c.image?'<div class="muted">Vorhandenes Bild bleibt, wenn kein neues gewählt wird.</div>':''}</div><div class="row"><div class="field grow"><label>Spalten</label><input id="g-cols" type="number" min="2" max="8" value="${c.cols||4}"></div><div class="field grow"><label>Zeilen</label><input id="g-rows" type="number" min="2" max="8" value="${c.rows||3}"></div></div>`;if(type==='order')f+=`<div class="field"><label>Text</label><textarea id="g-text">${esc(c.text||'')}</textarea></div><div class="field"><label>Wörter pro Teil</label><input id="g-size" type="number" min="1" value="${c.size||3}"></div>`;if(type==='crossword')f+=`<div class="field"><label>Wörter</label><textarea id="g-lines" class="admin-lines">${esc((c.entries||[]).map(x=>x.word+' | '+x.clue+' | '+x.start).join('\n'))}</textarea></div><div class="row"><div class="field grow"><label>Lösungs-Spalte</label><input id="g-col" type="number" min="1" value="${c.solutionCol||1}"></div><div class="field grow"><label>Lösungswort</label><input id="g-answer" value="${esc(c.answer||'')}"></div></div>`;if(type==='flashlight')f+=`<div class="field"><label>Versteckte Objekte</label><textarea id="g-lines" class="admin-lines">${esc((c.items||[]).map(x=>x.text+' | '+x.letter).join('\n'))}</textarea></div><div class="field"><label>Lösungswort</label><input id="g-answer" value="${esc(c.answer||'')}"></div>`;if(type==='differences')f+=`<div class="field"><label>Originalbild</label><input id="g-image-a" type="file" accept="image/*"><div class="muted">Das Originalbild dient dem Spieler als Vergleich.</div></div><div class="field"><label>Fehlerbild</label><input id="g-image-b" type="file" accept="image/*"><div class="muted">Lade das zweite Bild hoch und klicke danach direkt auf die sieben Fehlerstellen.</div></div><div class="diff-toolbar"><b id="diff-count">${(c.points||[]).length} / 7 Fehler markiert</b><button type="button" id="diff-undo" class="btn sec">Letzte Markierung entfernen</button><button type="button" id="diff-clear" class="btn sec">Alle löschen</button></div><div id="diff-board" class="diff-admin-board ${c.imageB?'':'no-image'}">${c.imageB?`<img id="diff-preview" src="${c.imageB}" alt="Fehlerbild">${(c.points||[]).map((p,i)=>`<i class="diff-admin-marker" style="left:${p.x}%;top:${p.y}%"><span>${i+1}</span></i>`).join('')}`:'Zuerst ein Fehlerbild auswählen.'}</div>`;if(type==='maze')f+=`<div class="field"><label>Labyrinth-Grösse</label><input id="g-size" type="number" min="15" max="31" step="2" value="${Math.max(15,c.size||21)}"><div class="muted">Empfohlen: 21 oder 25. Das Programm erzeugt genau einen Ausgang.</div></div>`;if(type==='cloze')f+=`<div class="cloze-help"><b>So funktioniert die Eingabe:</b><br>Markiere jede Lücke im Text mit eckigen Klammern, zum Beispiel: <code>Obadja muss [Israel] das Gericht über [Edom] ankündigen.</code><br><br><b>Richtige Lösungen:</b> Für jede Lücke genau eine Zeile, in derselben Reihenfolge:<br><code>Israel</code><br><code>Edom</code><br><br><b>Ablenkwörter:</b> Trage darunter beliebig viele zusätzliche Wörter ein, je Zeile ein Wort. Wenn die Wortauswahl aktiviert ist, erscheinen richtige Lösungen und Ablenkwörter gemeinsam in einer gemischten Wortbank. Nicht alle Wörter müssen verwendet werden.</div><div class="field"><label>Text mit gekennzeichneten Lücken</label><textarea id="g-text" placeholder="Obadja muss [Israel] das Gericht über [Edom] ankündigen.">${esc(c.text||'')}</textarea></div><div class="field"><label>Richtige Lösungen: pro Lücke genau eine Zeile</label><textarea id="g-lines" class="admin-lines" placeholder="Israel\nEdom">${esc((c.answers||[]).map(a=>Array.isArray(a)?a[0]:a).join('\n'))}</textarea></div><div class="field"><label>Ablenkwörter: optional, pro Zeile ein Wort</label><textarea id="g-distractors" class="admin-lines" placeholder="Jakob\nEsau\nDamaskus">${esc((c.distractors||[]).join('\n'))}</textarea></div><label><input id="g-choice" type="checkbox" style="width:auto" ${c.choice?'checked':''}> Wortbank mit richtigen Lösungen und Ablenkwörtern anzeigen</label><div class="muted" style="margin-top:6px">Ohne Haken tippt der Spieler jede Lösung selbst ein.</div>`;return f}
function renderDiffEditor(){const board=$('#diff-board');if(!board)return;const draft=window._diffDraft||{imageA:null,imageB:null,points:[]};const points=draft.points||[];$('#diff-count').textContent=`${points.length} / 7 Fehler markiert`;board.classList.toggle('no-image',!draft.imageB);board.innerHTML=draft.imageB?`<img id="diff-preview" src="${draft.imageB}" alt="Fehlerbild">${points.map((p,i)=>`<i class="diff-admin-marker" style="left:${p.x}%;top:${p.y}%"><span>${i+1}</span></i>`).join('')}`:'Zuerst ein Fehlerbild auswählen.';if(draft.imageB)board.onclick=e=>{if(e.target.closest('.diff-admin-marker'))return;const img=$('#diff-preview'),r=img.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)return;if(draft.points.length>=7)return alert('Es sind bereits sieben Fehler markiert.');draft.points.push({x:+(((e.clientX-r.left)/r.width)*100).toFixed(2),y:+(((e.clientY-r.top)/r.height)*100).toFixed(2)});renderDiffEditor()}}
function bindSpecialGameConfig(type){if(type!=='differences')return;const c=window._editingConfig||{};window._diffDraft={imageA:c.imageA||null,imageB:c.imageB||null,points:[...(c.points||[])]};renderDiffEditor();$('#g-image-a').onchange=async e=>{if(e.target.files[0])window._diffDraft.imageA=await prepareGameImage(e.target.files[0])};$('#g-image-b').onchange=async e=>{if(e.target.files[0]){window._diffDraft.imageB=await prepareGameImage(e.target.files[0]);window._diffDraft.points=[];renderDiffEditor()}};$('#diff-undo').onclick=()=>{window._diffDraft.points.pop();renderDiffEditor()};$('#diff-clear').onclick=()=>{window._diffDraft.points=[];renderDiffEditor()}}
function syncQuizDraft(){document.querySelectorAll('.q-text').forEach(x=>quizDraft[+x.dataset.q].text=x.value);document.querySelectorAll('.a-text').forEach(x=>quizDraft[+x.dataset.q].answers[+x.dataset.a].text=x.value);document.querySelectorAll('.a-correct').forEach(x=>quizDraft[+x.dataset.q].answers[+x.dataset.a].correct=x.checked)}
function bindQuizBuilder(){if(!$('#quiz-builder'))return;$('#add-question').onclick=()=>{syncQuizDraft();quizDraft.push(emptyQuestion());refreshGameConfig()};document.querySelectorAll('.del-q').forEach(b=>b.onclick=()=>{syncQuizDraft();quizDraft.splice(+b.dataset.q,1);refreshGameConfig()});document.querySelectorAll('.move-q').forEach(b=>b.onclick=()=>{syncQuizDraft();const i=+b.dataset.q,j=i+(+b.dataset.dir);[quizDraft[i],quizDraft[j]]=[quizDraft[j],quizDraft[i]];refreshGameConfig()});document.querySelectorAll('.add-a').forEach(b=>b.onclick=()=>{syncQuizDraft();quizDraft[+b.dataset.q].answers.push({id:crypto.randomUUID(),text:'',correct:false});refreshGameConfig()});document.querySelectorAll('.del-a').forEach(b=>b.onclick=()=>{syncQuizDraft();quizDraft[+b.dataset.q].answers.splice(+b.dataset.a,1);refreshGameConfig()})}
function refreshGameConfig(){syncCommonGameForm();$('#g-config').innerHTML=configFields($('#g-type').value);bindQuizBuilder()}

 $('#game-form').onsubmit=async e=>{e.preventDefault();try{const gameType=$('#g-type').value,required=[...document.querySelectorAll('.g-required:checked')].map(x=>x.value),num=id=>{const v=$(id).value;return v===''?null:+v},thresholds={};for(const r of ['gold','silver','bronze'])thresholds[r]={minPercent:num(`#g-${r}-pct`),maxSeconds:num(`#g-${r}-time`),maxMistakes:num(`#g-${r}-err`)};let config;if(gameType==='quiz'){syncQuizDraft();if(quizDraft.some(q=>!q.text.trim()||q.answers.length<2||q.answers.some(a=>!a.text.trim())||!q.answers.some(a=>a.correct)))return alert('Jede Frage braucht Text, mindestens zwei Antworten und mindestens eine richtige Antwort.');config={questions:structuredClone(quizDraft)}}else if(gameType==='hangman')config={word:$('#g-word').value.trim().toUpperCase(),clue:$('#g-clue').value.trim()};else if(gameType==='secret'){let image=edit?.config?.image||null;if($('#g-secret-image-remove')?.checked)image=null;if($('#g-secret-image')?.files[0])image=await prepareGameImage($('#g-secret-image').files[0]);if(!$('#g-encoded').value.trim()&&!image)return alert('Bitte Geheimschrift oder Bild angeben.');config={encoded:$('#g-encoded').value.trim(),answer:$('#g-answer').value.trim(),image}}else if(gameType==='cipher'){const text=$('#g-text').value.trim();if(!text)return alert('Bitte einen Lösungstext eingeben.');config={text,method:$('#g-cipher').value,shift:+$('#g-shift').value||3}}else if(gameType==='whoami'){const hints=($('#g-lines').value||'').split(/\n/).map(x=>x.trim()).filter(Boolean);if(!hints.length)return alert('Bitte mindestens einen Tipp eingeben.');config={answer:$('#g-answer').value.trim(),hints}}else if(gameType==='timeline'||gameType==='sequence'){const items=($('#g-lines').value||'').split(/\n/).map(x=>x.trim()).filter(Boolean);if(items.length<2)return alert('Bitte mindestens zwei Karten eingeben.');config={items}}else if(gameType==='versepairs'){const pairs=($('#g-lines').value||'').split(/\n/).map(x=>x.split('|').map(y=>y.trim())).filter(x=>x[0]&&x[1]).map(x=>({a:x[0],b:x[1]}));if(pairs.length<2)return alert('Bitte mindestens zwei vollständige Vers-Paare eingeben.');config={pairs}}else if(gameType==='woordle'){const word=norm($('#g-word').value);if(word.length<2||word.length>12)return alert('Das Woordle-Wort braucht 2 bis 12 Buchstaben.');config={word}}else{const lines=($('#g-lines')?.value||'').split(/\n/).map(x=>x.trim()).filter(Boolean);if(['memory','matching'].includes(gameType)){config={pairs:lines.map(x=>{const [a,b]=x.split('|').map(y=>y.trim());return{a,b}})};const files=[...($('#g-images')?.files||[])];for(let i=0;i<files.length;i++){const d=await prepareGameImage(files[i]),p=config.pairs[Math.floor(i/2)];if(p)p[i%2?'bImage':'aImage']=d}}else if(gameType==='wordsearch')config={words:lines.map(norm).filter(Boolean)};else if(gameType==='puzzle')config={image:edit?.config?.image||null,cols:+$('#g-cols').value||4,rows:+$('#g-rows').value||3};else if(gameType==='order')config={text:$('#g-text').value.trim(),size:+$('#g-size').value||3};else if(gameType==='crossword')config={entries:lines.map(x=>{const [word,clue,start]=x.split('|').map(y=>y.trim());return{word:norm(word),clue,start:+start||1}}),solutionCol:+$('#g-col').value||1,answer:norm($('#g-answer').value)};else if(gameType==='flashlight')config={items:lines.map((x,i)=>{const [text,letter]=x.split('|').map(y=>y.trim());return{text,letter,x:10+(i*27)%80,y:18+(i*31)%68}}),answer:norm($('#g-answer').value)};else if(gameType==='differences'){const d=window._diffDraft||{};if(!d.imageA||!d.imageB)return alert('Bitte Originalbild und Fehlerbild auswählen.');if((d.points||[]).length!==7)return alert('Bitte genau sieben Fehler direkt auf dem Fehlerbild markieren.');config={imageA:d.imageA,imageB:d.imageB,points:d.points}}else if(gameType==='maze'){let size=+$('#g-size').value||21;size=Math.max(15,Math.min(31,size));if(size%2===0)size++;config={size}}else if(gameType==='cloze'){const text=$('#g-text').value,gaps=[...text.matchAll(/\[([^\]]+)\]/g)],answers=lines.map(x=>x.trim()).filter(Boolean),distractors=($('#g-distractors').value||'').split(/\n/).map(x=>x.trim()).filter(Boolean);if(!gaps.length)return alert('Markiere im Text mindestens eine Lücke mit eckigen Klammern, zum Beispiel [Israel].');if(answers.length!==gaps.length)return alert(`Der Text enthält ${gaps.length} Lücke(n), aber es sind ${answers.length} richtige Lösungszeile(n) eingetragen.`);config={text,answers,distractors,choice:$('#g-choice').checked}}if(gameType==='puzzle'&&$('#g-image').files[0])config.image=await prepareGameImage($('#g-image').files[0]);};const item={id:edit?.id||slug($('#g-title').value)+'-'+Date.now().toString(36),title:$('#g-title').value.trim(),emoji:$('#g-emoji').value.trim()||'🎮',type:gameType,requiredSectionIds:required,badgeId:$('#g-badge').value,rewardMode:$('#g-reward').value,badgePart:+$('#g-part').value||1,coins:{bronze:+$('#g-cb').value||0,silver:+$('#g-cs').value||0,gold:+$('#g-cg').value||0},thresholds,config,status:$('#g-status').value},games=edit?book.games.map(x=>x.id===edit.id?item:x):[...(book.games||[]),item];await updateDoc(doc(db,'books',book.id),{games,updatedAt:serverTimestamp()});editingGameId=null;quizDraft=[];await loadContent();renderAdmin()}catch(err){console.error(err);alert('Speichern fehlgeschlagen: '+(err?.message||err))}};
